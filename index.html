<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI信件產生工具</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --border: #dadce0;
      --border-focus: #4285f4;
      --bg: #f8f9fa;
      --text: #202124;
      --text-muted: #5f6368;
      --shadow-sm: 0 1px 3px rgba(60,64,67, 0.12), 0 1px 2px rgba(60,64,67, 0.08);
      --danger: #d93025;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f1f3f4;
      color: var(--text);
      line-height: 1.6;
      padding: 40px 16px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.06);
    }

    .header {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .header h2 {
      font-size: 24px;
      font-weight: 600;
      color: #1e293b;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* 頂部分頁切換按鈕 */
    .tab-navigation {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 8px 18px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background-color: #e8f0fe;
      color: var(--primary);
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: #ffffff;
    }

    /* 三欄排版配置 */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 720px) {
      .controls { grid-template-columns: 1fr; }
      .container { padding: 20px; }
    }

    label {
      font-weight: 600;
      font-size: 14px;
      display: block;
      margin-bottom: 8px;
      color: #374151;
    }

    select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background-color: #ffffff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    select:focus, textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.15);
    }

    textarea {
      height: 130px;
      resize: vertical;
      line-height: 1.5;
    }

    /* 拖曳上傳區 */
    .dropzone {
      border: 2px dashed #b0bec5;
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      background: #fbfcfe;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }

    .dropzone.dragover {
      border-color: var(--primary);
      background: #e8f0fe;
    }

    .dropzone-icon {
      font-size: 28px;
      color: #78909c;
      margin-bottom: 4px;
    }

    .dropzone p {
      font-size: 14px;
      color: #455a64;
      font-weight: 500;
    }

    .dropzone span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .file-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .file-chip {
      background: #edf2f7;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #2d3748;
    }

    .file-chip .remove-btn {
      cursor: pointer;
      font-weight: bold;
      color: #a0aec0;
      border: none;
      background: transparent;
      font-size: 14px;
      line-height: 1;
    }

    .file-chip .remove-btn:hover {
      color: var(--danger);
    }

    .disclaimer {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .disclaimer-icon {
      font-size: 13px;
      color: #f59e0b;
      line-height: 1.3;
    }

    .action-row {
      margin: 20px 0;
      display: flex;
      align-items: center;
    }

    button.primary-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 11px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: background 0.2s, transform 0.1s;
    }

    button.primary-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button.primary-btn:disabled {
      background: #bdc1c6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .output-section {
      margin-top: 10px;
    }

    .output-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      padding: 20px;
      min-height: 160px;
      white-space: pre-wrap;
      font-size: 14px;
      position: relative;
      color: var(--text);
      line-height: 1.6;
    }

    .output-card.active {
      background: #ffffff;
      border-color: #c2e7ff;
      box-shadow: inset 0 0 0 1px #c2e7ff;
    }

    .copy-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: background 0.15s, border-color 0.15s;
    }

    .copy-btn:hover {
      background: #f1f3f4;
      border-color: #bdc1c6;
    }

    .model-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
      background: #f1f3f4;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>AI信件產生工具</h2>
      <p id="headerSubtitle">專為工程現場所需的信件中翻英、專門名詞對照與商務文件分析設計</p>
    </div>

    <!-- 模式切換按鈕 -->
    <div class="tab-navigation">
      <button class="tab-btn active" id="tabTranslate" onclick="switchMode('translate')">信件中翻英</button>
      <button class="tab-btn" id="tabDocAnalysis" onclick="switchMode('analysis')">文件分析</button>
    </div>

    <!-- 全域控制設定（專業領域、語氣設定、發信心情） -->
    <div class="controls">
      <div>
        <label for="categorySelect">專業領域類別：</label>
        <select id="categorySelect">
          <option value="General">日常/採購商務 (General)</option>
          <option value="Electrical">電機工程 (Electrical)</option>
          <option value="Instrumentation">儀表控制 (Instrument)</option>
          <option value="Accounting">會計財務 (Accounting)</option>
        </select>
      </div>
      <div>
        <label for="toneSelect">語氣設定：</label>
        <select id="toneSelect">
          <option value="Formal">正式禮貌</option>
          <option value="Direct">簡潔直效</option>
          <option value="Casual">美式口語</option>
          <option value="Literal">中文直譯 / 純分析</option>
        </select>
      </div>
      <div>
        <label for="moodSelect">發信心情：</label>
        <select id="moodSelect">
          <option value="Normal">正常 (客觀中立)</option>
          <option value="Happy">愉快 (熱情正面)</option>
          <option value="Angry">嚴正/質詢 (緊迫關注)</option>
        </select>
      </div>
    </div>

    <!-- 模式 1：信件中翻英 介面 -->
    <div id="translateModeSection">
      <label for="sourceText">中文信件草稿：</label>
      <textarea id="sourceText" placeholder="請輸入中文內容，例如：原先這幾項的單位都是攝氏，後來為了符合美國習慣改成華氏，不過經現場實際使用，由於絕大多數表頭單位都為攝氏，因此決定還是改回攝氏，請協助將單位以及敘述改回原本的內容..."></textarea>
    </div>

    <!-- 模式 2：文件分析 介面 -->
    <div id="analysisModeSection" style="display: none;">
      <label>上傳廠商文件或報價單：</label>
      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <div class="dropzone-icon">📁</div>
        <p>點擊選取或將檔案直接拖曳至此處</p>
        <span>支援 PDF、PNG、JPG、CSV、TXT 等文件（可同時上傳多份文件進行對比）</span>
        <input type="file" id="fileInput" multiple style="display: none;" onchange="handleFileSelect(event)">
      </div>

      <div class="file-list" id="fileList"></div>

      <label for="analysisPromptInput">您的中文指令與訴求：</label>
      <textarea id="analysisPromptInput" placeholder="例如：請分析這兩份報價單，指出新版價格上漲的品項，並用正式語氣要求廠商說明漲價原因，同時確認交期是否依然維持 6 週..."></textarea>
    </div>
    
    <!-- 聲明與免責小字 -->
    <div class="disclaimer">
      <span class="disclaimer-icon">ⓘ</span>
      <span>本系統採用 Google Gemini AI 技術自動生成中翻英與文件比對建議。模型輸出可能偶有偏差，信件發送前請務必核對關鍵設備編號、參數數值、合約條款與收件人權限。</span>
    </div>

    <!-- 操作按鈕 -->
    <div class="action-row">
      <button id="submitBtn" class="primary-btn" onclick="executeCurrentMode()">
        <span id="btnSpinner" class="spinner" style="display: none;"></span>
        <span id="btnText">生成英文信件</span>
      </button>
    </div>

    <!-- 英文結果展示區 -->
    <div class="output-section">
      <label id="outputLabel">英文郵件建議：</label>
      <div class="output-card" id="outputCard">
        <button class="copy-btn" id="copyBtn" onclick="copyOutput()" style="display: none;">複製內文</button>
        <div id="outputContent" style="color: var(--text-muted);">處理結果將呈現於此...</div>
      </div>
      <div id="modelBadge" class="model-badge" style="display: none;"></div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://gemini-translator-proxy.wandering-poetry-ecb7.workers.dev";

    let currentMode = 'translate'; // 預設模式：'translate' 或 'analysis'
    let uploadedFiles = [];

    const DOMAIN_GLOSSARY = {
      General: `採購與商務術語：Quote / Quotation (報價單), Lead time (交期), Unit price (單價), Payment terms (付款條件), IncoTerms (如 FOB/DDP), PO (採購訂單)。`,
      Electrical: `
- 電機術語對照字典（僅供置換，草稿未提及則忽略）：
  * 跳脫/復歸: trip / reset
  * 電驛/比壓/比流/開關: protection relay / PT / CT / circuit breaker
  * 送電/停電: energize / de-energize
  * 故障跳脫: trip on fault / overload
      `,
      Instrumentation: `
- 儀表術語對照字典（僅供置換，草稿未提及則忽略）：
  * 變送器: transmitter (DP transmitter, PT)
  * 漂移/校正: drift / calibrate / recalibrate
  * 控制閥動作: valve hunting, stroke test, fail-safe position
  * 回路測試: loop check
      `,
      Accounting: `
- 會計財務術語（僅供置換，草稿未提及則忽略）：
  * 發票/沖銷/對帳: invoice / billing / write-off / reconcile / account reconciliation
  * 逾期/付款條件: overdue / past due / payment terms (Net 30)
  * 傳票/報銷: voucher / journal entry / reimbursement
      `
    };

    const TONE_GUIDES = {
      Formal: '專業正式風格。文法完整嚴謹，語氣客氣尊重。',
      Direct: '簡潔直效風格。直奔主題，語句乾脆精準，無冗詞。',
      Casual: '美式職場口語風格。自然親切，多用常見商務片語。',
      Literal: '純文字直譯/純分析模式。嚴禁生成 Subject、稱謂與結尾簽名，直接輸出核心內容。'
    };

    const MOOD_GUIDES = {
      Normal: '情緒客觀平實，中立理性。',
      Happy: '情緒愉快友善，語氣熱情配合。',
      Angry: '情緒嚴正堅定（Firm & Stern）。在符合職場禮貌前提下，展現問題嚴重性、緊迫感與責任要求。'
    };

    // 模式切換邏輯
    function switchMode(mode) {
      currentMode = mode;
      const tabTranslate = document.getElementById('tabTranslate');
      const tabDocAnalysis = document.getElementById('tabDocAnalysis');
      const translateSection = document.getElementById('translateModeSection');
      const analysisSection = document.getElementById('analysisModeSection');
      const btnText = document.getElementById('btnText');
      const outputLabel = document.getElementById('outputLabel');
      const headerSubtitle = document.getElementById('headerSubtitle');

      if (mode === 'translate') {
        tabTranslate.classList.add('active');
        tabDocAnalysis.classList.remove('active');
        translateSection.style.display = 'block';
        analysisSection.style.display = 'none';
        btnText.innerText = '生成英文信件';
        outputLabel.innerText = '英文郵件建議：';
        headerSubtitle.innerText = '專為工程現場與商務溝通設計的精準術語中翻英工具';
      } else {
        tabTranslate.classList.remove('active');
        tabDocAnalysis.classList.add('active');
        translateSection.style.display = 'none';
        analysisSection.style.display = 'block';
        btnText.innerText = '分析文件並撰寫信件';
        outputLabel.innerText = '文件分析與英文郵件建議：';
        headerSubtitle.innerText = '上傳廠商報價單、規格書或型錄，自動比對細節並草擬專業回信';
      }
    }

    // 檔案拖曳與選取處理
    const dropzone = document.getElementById('dropzone');
    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      handleFiles(dt.files);
    });

    function handleFileSelect(e) {
      handleFiles(e.target.files);
    }

    async function handleFiles(files) {
      for (const file of files) {
        const base64Data = await fileToBase64(file);
        uploadedFiles.push({
          name: file.name,
          mimeType: file.type || 'application/octet-stream',
          data: base64Data
        });
      }
      renderFileList();
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    function renderFileList() {
      const listEl = document.getElementById('fileList');
      listEl.innerHTML = '';
      uploadedFiles.forEach((file, index) => {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        chip.innerHTML = `
          <span>📄 ${file.name}</span>
          <button class="remove-btn" onclick="removeFile(${index})">&times;</button>
        `;
        listEl.appendChild(chip);
      });
    }

    function removeFile(index) {
      uploadedFiles.splice(index, 1);
      renderFileList();
    }

    // 執行請求主流程
    async function executeCurrentMode() {
      const category = document.getElementById('categorySelect').value;
      const tone = document.getElementById('toneSelect').value;
      const mood = document.getElementById('moodSelect').value;
      
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const outputCard = document.getElementById('outputCard');
      const outputContent = document.getElementById('outputContent');
      const copyBtn = document.getElementById('copyBtn');
      const modelBadge = document.getElementById('modelBadge');

      const glossary = DOMAIN_GLOSSARY[category] || '';
      const toneInstruction = TONE_GUIDES[tone] || TONE_GUIDES.Direct;
      const isLiteral = (tone === 'Literal');
      const moodInstruction = isLiteral ? '直譯模式：忽略情緒修飾，聚焦於客觀數據與直譯。' : (MOOD_GUIDES[mood] || MOOD_GUIDES.Normal);

      let promptPayload = '';
      let filesPayload = [];

      if (currentMode === 'translate') {
        const text = document.getElementById('sourceText').value.trim();
        if (!text) {
          alert('請輸入中文信件內容');
          return;
        }

        const formatInstruction = isLiteral
          ? `1. 絕對禁止生成 "Subject:"、稱謂或簽名結尾。
2. 絕對禁止任何客套問候或感謝句。
3. 嚴格逐句翻譯草稿，直接輸出純文字英文。`
          : `1. 格式：
   Subject: [簡短精確切合草稿主題]
   
   Dear [Name],
   [正文]
   
   Best regards,
   [Your Name]
2. 【核心嚴禁事項】：
   - 資訊量必須與中文草稿嚴格等比！草稿只寫一句話，正文就只能寫 1-2 句話。
   - 絕對禁止虛構草稿未提及的情節（如設備測試、會議日程、技術評估、待辦事項清單）。
   - 【術語對照字典】僅作為字典使用。若草稿未涉及字典中的設備或名詞，嚴禁自行塞入這些詞彙！
3. 請依照指定的語氣與心情進行文字潤飾，但不可無中生有。
4. 直接輸出信件內容，無須任何前言或結語解釋。`;

        promptPayload = `
你是一位專業中翻英翻譯助手。你的唯一任務是將【中文草稿】翻譯並潤飾成英文信件。

【術語對照字典（僅供名詞置換，草稿未提及則徹底忽略）】
${glossary}

【語氣設定】: ${toneInstruction}
【發信心情】: ${moodInstruction}

【輸出格式與邊界規則】
${formatInstruction}

【中文草稿（這是唯一的事實來源，嚴禁自行延伸或腦補情節）】
${text}
        `.trim();

      } else {
        // 文件分析模式
        const userPrompt = document.getElementById('analysisPromptInput').value.trim();
        if (!userPrompt && uploadedFiles.length === 0) {
          alert('請至少上傳一份文件或輸入您的分析/信件撰寫指令');
          return;
        }

        filesPayload = uploadedFiles;
        promptPayload = `
你是一位精通跨國工程採購、現場維運與商務議價的專業工程顧問。
使用者已附加了工程/報價文件，並給予了具體的工作指令。

【領域術語規範】
${glossary}

【溝通風格設定】: ${toneInstruction}
【發信情緒傾向】: ${moodInstruction}

【使用者的核心指令與訴求】
${userPrompt || '請分析所附文件的關鍵數據與項目，並向廠商草擬一封專業的確認與回覆郵件。'}

【任務與輸出要求】
1. 請仔細檢視所有附加的文件（包含報價單單價變更、型號變更、交期條款、規格參數等）。
2. 若使用者要求比對報價單或文件，請嚴格根據文件真實內容指出差異（如：哪項料號漲價、漲幅多少、交期差異等），嚴禁憑空捏造文件中不存在的數據。
3. 根據比對結果與使用者的中文訴求，撰寫出符合指定領域、語氣與心情的標準英文商務/技術郵件（包含 Subject、稱謂、條理清楚的正文、具體提問或訴求、簽名結尾）。

        `.trim();
      }

      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.innerText = currentMode === 'translate' ? 'AI 轉譯中...' : 'AI 正在解析文件與生成中...';
      
      outputCard.classList.remove('active');
      outputContent.style.color = 'var(--text-muted)';
      outputContent.innerText = '正在處理並優化內容...';
      copyBtn.style.display = 'none';
      modelBadge.style.display = 'none';

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: promptPayload,
            files: filesPayload
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || data.error);

        const generatedText = data.candidates[0].content.parts[0].text;
        outputContent.style.color = 'var(--text)';
        outputContent.innerText = generatedText;
        outputCard.classList.add('active');
        copyBtn.style.display = 'block';

        if (data.usedModel) {
          modelBadge.innerText = `⚡ 本次生成模型：${data.usedModel}`;
          modelBadge.style.display = 'inline-flex';
        }
      } catch (err) {
        outputContent.style.color = 'var(--danger)';
        outputContent.innerText = `發生錯誤: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.innerText = currentMode === 'translate' ? '生成英文信件' : '分析文件並撰寫信件';
      }
    }

    function copyOutput() {
      const text = document.getElementById('outputContent').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = '已複製！';
        setTimeout(() => { btn.innerText = '複製內文'; }, 2000);
      });
    }
  </script>
